# Selects the JDBC stack for local/dev (not a secret). %test uses h2 via test/application.properties.
# In OpenShift (prod), QUARKUS_DATASOURCE_DB_KIND is also supplied from the database Secret for parity.
quarkus.datasource.db-kind=postgresql

# In OpenShift, set via Kubernetes Secret -> env (see customers-gitops deployment envFrom):
# QUARKUS_DATASOURCE_USERNAME, QUARKUS_DATASOURCE_PASSWORD, QUARKUS_DATASOURCE_JDBC_URL,
# QUARKUS_DATASOURCE_DB_KIND
# (JDBC URL points at your PostgreSQL outside the cluster; add ?sslmode=require if needed.)
%prod.quarkus.datasource.jdbc.max-size=8
%prod.quarkus.datasource.jdbc.min-size=2
%prod.quarkus.http.port=8080
%prod.quarkus.hibernate-orm.database.generation=none


quarkus.openshift.route.expose=true
quarkus.helm.repository.deployment-target=openshift

quarkus.swagger-ui.always-include=true
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET, PUT, POST
